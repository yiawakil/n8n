services:
  - type: web
    name: n8n-erpnext
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # Free tier works seamlessly because Neon PostgreSQL persists all data
    region: oregon
    envVars:
      - key: PORT
        value: 5678
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        sync: false # Set to your public Render URL, e.g., https://n8n-erpnext.onrender.com/
      - key: NODE_ENV
        value: production

      # --- Neon PostgreSQL Database Configuration ---
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_CONNECTION_STRING
        sync: false # Paste your Neon connection string (e.g. postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require)
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # --- Critical for Stateless Deployment: Encryption Key ---
      # Set this to any fixed random 32+ character string so n8n can always decrypt your saved credentials
      - key: N8N_ENCRYPTION_KEY
        sync: false

      # --- Optimizations & Pruning ---
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "10000"
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: default
      - key: N8N_PAYLOAD_SIZE_MAX
        value: "64"
